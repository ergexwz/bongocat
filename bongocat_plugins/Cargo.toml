[workspace]
resolver = "3"
members = [
    "crates/bongocat-plugin-sdk",
    "crates/bongocat-companion",
    "plugins/todo",
    "plugins/mail",
    "plugins/cyberwork",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
atomic-write-file = "=0.3.1"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["wry", "macos-private-api"] }
tauri-build = { version = "=2.7.4", features = [] }
tauri-plugin-notification = "=2.3.3"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
uuid = { version = "=1.28.0", features = ["v4"] }
keyring = { version = "=4.2.0", features = ["v1"] }
async-imap = { version = "=0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
webpki-roots = "=0.26.11"
async-http-proxy = { version = "=1.2.5", default-features = false, features = ["runtime-tokio"] }
futures-lite = "=2.6.1"
log = "=0.4.34"

bongocat-plugin-sdk = { path = "crates/bongocat-plugin-sdk" }
bongocat-companion = { path = "crates/bongocat-companion" }

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false
rpath = false
