tokio.workspace = true
tokio-rustls.workspace = true
uuid.workspace = true
webpki-roots.workspace = true

[[bin]]
name = "bongocat-mail"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
